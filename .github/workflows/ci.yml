name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Oldest supported (engines floor) and current.
        node-version: ['24', '26']
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      # The whole suite is hermetic: gateway determinism and its failure modes
      # are exercised against local in-process servers (gateway-determinism,
      # commp-fixture-parity), so no job here depends on any outside service.
      - run: pnpm test
      - run: pnpm run build
