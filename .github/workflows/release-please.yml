name: release-please

on:
  push:
    branches: [main]
  # Manual escape hatch: publish the version currently in packages/cli when the
  # automatic publish was missed (e.g. a release was tagged but its publish job
  # did not run). Skips release-please entirely and runs publish on its own.
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# One release at a time per ref. Concurrent runs race to cut the same tag, and
# the loser fails with "Release already_exists for tag_name", which skips
# publish and leaves a tagged release that never reaches npm. Queue rather than
# cancel, so a run that has already reached npm publish finishes.
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    # A dispatch publishes what is already on main and cuts no release, so this
    # job is skipped there. Running it would try to re-create an existing tag.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      # Manifest mode with the package at the ROOT path: the action emits the
      # unprefixed outputs (`release_created`, `tag_name`) alongside the
      # aggregate `releases_created`. The release unit is the repo root so the
      # changelog captures app/, packages/core, and packages/relay commits —
      # the npm tarball bundles core and app-dist, so those ARE the artifact.
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # Opens/updates the release PR, and on merge cuts a GitHub release + tag.
      # Versioning stays pre-1.0: bump-minor-pre-major in release-please-config.json
      # bumps the minor on breaking changes instead of the major.
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: release-please
    # Keep `!cancelled()`. A job whose `needs` dependency failed or was skipped
    # is dropped before its own `if` is evaluated, unless that `if` contains a
    # status function. Remove it and the workflow_dispatch clause below stops
    # running in the case it exists for, a failed release-please.
    #
    # Keep the ref check. workflow_dispatch accepts any ref and npm trusts this
    # workflow, so this is what stops a branch from publishing with provenance.
    if: >-
      ${{ !cancelled()
          && github.ref == 'refs/heads/main'
          && (needs.release-please.outputs.release_created == 'true'
              || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing; provenance is automatic
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
      # Install, verify, and build with pnpm (the repo's package manager).
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      # Publish with npm: its OIDC trusted publishing authenticates against the
      # Trusted Publisher configured on npmjs.com for this repo + workflow, so no
      # NPM_TOKEN is needed and provenance is automatic. Trusted publishing needs
      # npm >= 11.5.1. --ignore-scripts skips the prepack rebuild (dist is built
      # above). The package's initial version had to be published manually once;
      # OIDC cannot publish a package that does not yet exist.
      - run: npm install -g npm@latest
      - run: npm publish --access public --ignore-scripts
        working-directory: packages/cli
